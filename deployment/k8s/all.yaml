apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: otel-demo
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_TRACES_SAMPLER: always_on
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=otel-demo,deployment.environment.name=demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/jaeger:2.6.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: ui
          containerPort: 16686
        - name: otlp-http
          containerPort: 4318
        - name: otlp-grpc
          containerPort: 4317
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          tcpSocket: &id001
            port: 16686
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket: *id001
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 16686
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: otel-demo
spec:
  selector:
    app: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: ui
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: otel-demo/inventory-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          httpGet: &id001
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet: *id001
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        envFrom:
        - configMapRef:
            name: otel-config
        env:
        - name: OTEL_SERVICE_NAME
          value: inventory-service
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=65.0
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: otel-demo
spec:
  selector:
    app: inventory-service
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: otel-demo/order-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          httpGet: &id001
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet: *id001
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        envFrom:
        - configMapRef:
            name: otel-config
        env:
        - name: OTEL_SERVICE_NAME
          value: order-service
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=65.0
        - name: INVENTORY_URL
          value: http://inventory-service:8080
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: otel-demo
spec:
  selector:
    app: order-service
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: otel-demo/frontend:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 128Mi
        startupProbe:
          httpGet: &id001
            path: /healthz
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet: *id001
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: otel-demo
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 8080
    targetPort: http
