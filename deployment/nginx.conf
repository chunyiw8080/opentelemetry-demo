server {
 listen 8080;
 root /usr/share/nginx/html;
 location = /healthz { access_log off; return 200 'ok'; }
 location /api/ { proxy_pass http://order-service:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 10s; }
 location = /otel/v1/traces { proxy_pass http://jaeger:4318/v1/traces; proxy_http_version 1.1; client_max_body_size 2m; }
 location / { try_files $uri $uri/ /index.html; }
}
