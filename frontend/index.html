<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace Lab</title></head><body>
<main><header><span class="badge">OPENTELEMETRY × JAEGER</span><h1>Trace Lab<span>调用链实验室</span></h1><p>发起一次订单请求，追踪它经过的每一个服务。</p></header>
<section class="path"><b>01 浏览器</b><span>→</span><b>02 Order Service</b><span>→</span><b>03 Inventory Service</b></section>
<section class="panel"><h2>选择测试场景</h2><div class="buttons"><button data-scenario="normal">正常请求 <small>库存查询约 80 ms</small></button><button data-scenario="slow">慢请求 <small>库存查询约 1.8 s</small></button><button data-scenario="error">异常请求 <small>库存 503 → 订单 502</small></button></div><label>Jaeger 地址 <input id="jaeger" value="http://localhost:16686" aria-label="Jaeger 地址"></label><p id="status" role="status">准备就绪。点击按钮开始追踪。</p><a id="trace" target="_blank" rel="noopener" hidden>在 Jaeger 中查看此 Trace ↗</a><pre id="result">响应结果将在这里显示</pre></section><footer>W3C Trace Context · OTLP/HTTP · 100% 采样 · 测试环境</footer></main><script type="module" src="/src/main.js"></script></body></html>
